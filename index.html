<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4c1d95">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>MELAN</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MELAN">
<style>
:root{--bg:#f8f5ff;--c:#fff;--t:#1f1535;--m:#6e6585;--p:#5b21b6;--pt:#fff;--a:#ea580c;--b:#e2d9f3;--r:#b42318;--o:#b45309;--g:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#150f24;--c:#201836;--t:#efe9fb;--m:#a79dc2;--p:#a78bfa;--pt:#190d33;--a:#fb923c;--b:#35294f;--r:#f87171;--o:#fbbf24;--g:#4ade80}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
input,select,textarea,button{font:inherit;color:inherit}a{color:var(--a);cursor:pointer;text-decoration:underline}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#4c1d95;color:#fff;position:sticky;top:0;z-index:10}.top button{background:none;border:0;color:#fff;font-size:24px;padding:0 6px}
aside{position:fixed;left:0;top:0;bottom:0;width:250px;background:linear-gradient(180deg,#3b1480,#6d28d9);color:#fff;transform:translateX(-100%);transition:.2s;z-index:30;padding:14px;overflow:auto;display:flex;flex-direction:column}aside.open{transform:none}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}.brand img{width:44px;height:44px;border-radius:12px}.brand small{display:block;opacity:.8}
.ni{display:block;padding:11px 12px;border-radius:12px;color:#fff;margin:3px 0;cursor:pointer}.ni.on{background:#f97316;font-weight:700}
.who{margin-top:auto;padding-top:14px;border-top:1px solid #fff4;font-size:14px}.who a{color:#fed7aa;display:block;margin-top:4px}
#ov{display:none;position:fixed;inset:0;background:#0008;z-index:20}#ov.on{display:block}
@media(min-width:900px){aside{transform:none}.top{display:none}main{margin-left:250px!important}#ov{display:none!important}}
main{max-width:860px;margin:0 auto;padding:12px}.lg{max-width:460px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:0 0 10px}
.card input,.card select,.card textarea{width:100%;margin:4px 0;padding:9px;border:1px solid var(--b);border-radius:10px;background:var(--bg)}.card input[type=checkbox]{width:auto}
textarea{min-height:64px}
.pri,.card>button,.card details>button{background:linear-gradient(90deg,#ea580c,#f97316);color:#fff;font-weight:700;border:0;border-radius:10px;padding:10px 14px;margin-top:6px;width:100%}
.ghost{background:none!important;color:var(--t)!important;border:1px solid var(--b)!important;font-weight:400!important}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.m{color:var(--m);font-size:14px}.tag{font-size:12px;border:1px solid var(--b);border-radius:12px;padding:2px 9px;flex:0 0 auto}
.red{color:var(--r)}.org{color:var(--o)}.grn{color:var(--g)}
.hero{text-align:center;padding:10px 0}.hero img{width:88px;height:88px;border-radius:22px}.hero h2{margin:6px 0 0;color:var(--p)}.hero p{margin:2px 0;color:var(--m)}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;padding:9px;border:1px solid var(--b);background:var(--c);border-radius:12px}.tabs button.on{background:var(--p);color:var(--pt);border-color:var(--p);font-weight:700}
.sc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.sc button{min-width:44px;height:44px;border:1px solid var(--b);background:var(--bg);border-radius:10px}.sc button.on{background:var(--a);color:#fff;border-color:var(--a)}
.bar{display:grid;grid-template-columns:100px 1fr 42px;gap:8px;align-items:center;font-size:14px;margin:5px 0}.bar div{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%}.bar em{font-style:normal;text-align:right}
.g{background:var(--g)}.o{background:var(--o)}.r{background:var(--r)}
.chips label{display:inline-block;border:1px solid var(--b);border-radius:16px;padding:4px 12px;margin:3px 4px 3px 0;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid #bbb;padding:4px 6px;text-align:center}td:first-child,th:first-child{text-align:left}.wrap{overflow-x:auto}
.pt{border:1px dashed var(--b);border-radius:10px;padding:8px;margin:8px 0}#qs{counter-reset:q}.qn::before{counter-increment:q;content:"Question " counter(q)}
.paper{background:#fff;color:#111;font-family:"Times New Roman",Times,serif;border:1px solid var(--b);padding:18px;border-radius:8px;margin-bottom:12px;position:relative}
.ph{text-align:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:10px}.ph h1{margin:0;font-size:22px;letter-spacing:1px;text-transform:uppercase}.ph h2{margin:4px 0 0;font-size:18px;text-transform:uppercase}.ph h3{margin:2px 0;font-size:16px}
.ph .mt{display:flex;justify-content:space-between;flex-wrap:wrap;font-size:14px;gap:4px 14px;margin-top:6px}.sheet .ph{padding:0 92px 8px}.sec{margin:16px 0 4px;border-bottom:1px solid #111;font-size:15px}
.qq{margin:12px 0}.pl2{margin:8px 0 2px}.mkq{float:right;font-weight:700}
.ln{background:repeating-linear-gradient(transparent 0,transparent 27px,#8a94a6 28px);line-height:28px;min-height:56px;padding:0 6px;white-space:pre-wrap;border:1px solid #777;border-radius:3px;position:relative;margin:4px 0;font-family:"Segoe Print","Bradley Hand","Noteworthy","Comic Sans MS",cursive;color:#1a3a9c}
.paper textarea.an{width:100%;display:block;margin:4px 0;font-family:inherit;font-size:16px;color:#111;border:1px solid #777;border-radius:3px;background:repeating-linear-gradient(transparent 0,transparent 27px,#8a94a6 28px);line-height:28px;min-height:84px;padding:0 6px}
.mk{position:absolute;right:6px;bottom:0;color:#c00;font-weight:700;font-size:14px;font-family:Arial,sans-serif}
.opt{display:block;padding:4px 0}.opt input{margin-right:8px}
.gi{display:inline-block;width:130px;border:0;border-bottom:2px solid #222;background:transparent;margin:0 4px;padding:2px;font-size:16px;color:#1a3a9c}.bl{display:inline-block;width:110px;border-bottom:2px solid #222}.gp{line-height:2}
.mrow{margin:6px 0}.slot{display:inline-block;min-width:130px;min-height:32px;border-bottom:2px solid #222;margin-right:8px;text-align:center;vertical-align:middle;padding:2px 6px;background:#f3f0ff;border-radius:4px;color:#1a3a9c}
.pool{border:1px dashed #888;border-radius:8px;padding:6px;margin-top:8px}.chip{display:inline-block;border:1px solid #5b21b6;border-radius:16px;padding:4px 12px;margin:4px;background:#fff;cursor:grab;user-select:none}.chip.sel{background:#f97316;color:#fff}.chip.used{opacity:.25;pointer-events:none}
.score{position:absolute;top:12px;right:12px;border:2px solid #b42318;color:#b42318;padding:4px 12px;font-weight:700;border-radius:8px;font-size:20px}
.cmx{font-family:"Comic Sans MS","Comic Neue","Chalkboard SE",cursive;background:#fff6c7;border:2px solid #e0a800;border-radius:12px;padding:3px 10px;margin:3px 0 6px 20px;color:#b3123f;font-size:15px;display:inline-block}
.gd{background:#eaf3ff;border-radius:6px;padding:5px 9px;font-size:14px;margin-top:4px}.tot{text-align:right;font-weight:700;color:#b42318}
@media print{aside,.top,.np,#ov{display:none!important}main{margin:0!important}body{background:#fff}.sheet{border:0;page-break-after:always}}
#melan-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#24133f;color:#fff;padding:12px 18px;border-radius:12px;z-index:9999;max-width:90%;box-shadow:0 5px 24px #0005;display:none}
</style>
</head><body><div id="app"></div><div id="melan-toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
// MELAN in-app notifications: avoid browser '[site] says' alert boxes.
window.alert=(message)=>{const t=document.getElementById('melan-toast');if(!t)return; t.textContent=String(message??'');t.style.display='block';clearTimeout(window.__melanToastTimer);window.__melanToastTimer=setTimeout(()=>t.style.display='none',3600)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=['Knowledge','Understanding','Application','Analysis','Evaluation','Creation'];
const DEF={overN:6,grades:'',bands:[{min:80,name:'Distinction',c:'Excellent work. Keep it up.'},{min:60,name:'Credit',c:'Good work. Aim higher.'},{min:40,name:'Pass',c:'Fair. More practice needed.'},{min:0,name:'Needs help',c:'Please revise and ask for help.'}]};
let SET=DEF,SS={},U=JSON.parse(localStorage.getItem('u')||'null'),V='home',C={},G=[],QS=[],QI=0,PID=0,M='l',SUBS=[],CLS=[],PP={},NT={},DL='',SELC=null,PQ=new URLSearchParams(location.search).get('p');
const T=['create table if not exists x_schools(id integer primary key autoincrement,name text,code text unique,tcode text,settings text)',
'create table if not exists x_users(id integer primary key autoincrement,school_id int,name text,role text,gender text,cls text,pin text,pinp text,cno text,phone text,email text)',
'create table if not exists x_learner_codes(code text primary key,user_id int,created_at text default current_timestamp)',
"insert or ignore into x_learner_codes(code,user_id) select cno,id from x_users where role='learner' and cno is not null",
'create table if not exists x_classes(id integer primary key autoincrement,school_id int,name text,code text unique)',
'create table if not exists x_subjects(id integer primary key autoincrement,school_id int,name text,short text)',
'create table if not exists x_topics(id integer primary key autoincrement,school_id int,cls text,term text,subject text,name text)',
'create table if not exists x_subtopics(id integer primary key autoincrement,topic_id int,name text)',
'create table if not exists x_comps(id integer primary key autoincrement,topic_id int,sub_id int,name text)',
'create table if not exists x_papers(id integer primary key autoincrement,school_id int,teacher_id int,title text,cls text,term text,subject text,status text,pdate text,deadline text,plan text,shuffle int)',
'create table if not exists x_questions(id integer primary key autoincrement,paper_id int,n int,sec text,stem text,topic_id int,sub_id int,comp_id int)',
'create table if not exists x_parts(id integer primary key autoincrement,paper_id int,qq int,qn int,label text,n text,text text,kind text,marks real,spaces int,bloom text,data text,guide text)',
'create table if not exists x_submissions(id integer primary key autoincrement,paper_id int,learner_id int)',
'create table if not exists x_answers(id integer primary key autoincrement,sub_id int,qid int,idx int,answer text,norm text,score real,comment text)',
'create index if not exists j1 on x_answers(qid,norm)','create index if not exists j2 on x_answers(sub_id)','create index if not exists j3 on x_parts(paper_id)','create index if not exists j4 on x_questions(paper_id)',
'create index if not exists j5 on x_topics(school_id,subject)','create index if not exists j6 on x_users(school_id,role,pin)','create index if not exists j7 on x_submissions(paper_id,learner_id)','create index if not exists j8 on x_subtopics(topic_id)','create index if not exists j9 on x_comps(topic_id)',
'create index if not exists j10 on x_users(cno)','create index if not exists j11 on x_users(school_id,role,cls)','create index if not exists j12 on x_papers(school_id,status,cls)','create index if not exists j13 on x_answers(sub_id,qid)','create index if not exists j14 on x_submissions(learner_id,paper_id)','create index if not exists j15 on x_questions(topic_id,sub_id)','create index if not exists j16 on x_parts(paper_id,qn)'];
const cfg=()=>{const c=window.CFG||{};return c.url&&c.token?{url:c.url.replace('libsql://','https://'),token:c.token}:JSON.parse(localStorage.getItem('cfg')||'null')};
const arg=v=>v==null?{type:'null'}:typeof v==='number'?(Number.isInteger(v)?{type:'integer',value:String(v)}:{type:'float',value:v}):{type:'text',value:String(v)};
async function pipe(list){const c=cfg();const r=await fetch(c.url+'/v2/pipeline',{method:'POST',headers:{Authorization:'Bearer '+c.token,'Content-Type':'application/json'},body:JSON.stringify({requests:[...list.map(([sql,a=[]])=>({type:'execute',stmt:{sql,args:a.map(arg)}})),{type:'close'}]})});
 const j=await r.json();if(!j.results)throw new Error(j.error||'Database error');
 return j.results.slice(0,list.length).map(x=>{if(x.type==='error')throw new Error(x.error.message);const q=x.response.result;return q.rows.map(w=>Object.fromEntries(q.cols.map((c,i)=>[c.name,w[i].value])))})}
const db=async(sql,a=[])=>(await pipe([[sql,a]]))[0];
const ins=async(s,a)=>Number((await db(s,a))[0].id);
async function migrate(){if(localStorage.getItem('mig')==='x3')return;let ok=true;for(const q of T)try{await db(q)}catch(e){ok=false}try{await db('alter table x_users add column tcls text')}catch(e){if(!/duplicate/i.test(e.message))ok=false}if(ok)localStorage.setItem('mig','x3')}
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const opts=(r,k='name')=>r.map(x=>`<option value="${x.id}">${esc(x[k])}</option>`).join('');
const val=id=>$('#'+id).value.trim(),safe=f=>async(...a)=>{try{await f(...a)}catch(e){alert(e.message)}};
const pc=t=>t&&t[1]?Math.round(t[0]/t[1]*100):0,band=p=>SET.bands.find(b=>p>=b.min)||SET.bands[SET.bands.length-1];
const norm=s=>s.toLowerCase().replace(/\s+/g,' ').replace(/[.,;!]+$/,'').trim();
const grade=p=>{for(const l of (SET.grades||'').split('\n')){const m=l.match(/(\d+)\s*-\s*(\d+)\s*=\s*(\S+)/);if(m&&p>=+m[1]&&p<=+m[2])return m[3]}return''},gtxt=p=>grade(p)?` · Grade ${grade(p)}`:'';
const bars=b=>L.map(l=>{const v=b[l];if(!v||!v[1])return `<div class=bar><span>${l}</span><div></div><em>-</em></div>`;const p=pc(v);return `<div class=bar><span>${l}</span><div><i class="${p>=70?'g':p>=50?'o':'r'}" style="width:${p}%"></i></div><em>${p}%</em></div>`}).join('');
const dl=(id,a)=>`<datalist id=${id}>${[...new Set(a)].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
const fd=x=>x?String(x).replace('T',' '):'',base=()=>location.href.split('?')[0].split('#')[0],wa=t=>window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
const myCls=()=>{const a=(U.tcls||'').split('|').filter(Boolean);return U.role==='teacher'&&a.length?CLS.filter(c=>a.includes(c.name)):CLS};
const TF=()=>U.role==='super'?'%':String(U.id);
const rcode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:5},()=>a[Math.floor(Math.random()*a.length)]).join('')};
const rnd4=()=>String(Math.floor(1000+Math.random()*9000));

/* ---------- connection (owner only) ---------- */
function setup(){const c=cfg()||{};$('#app').innerHTML=`<div class=lg><div class=hero><img src=logo-96.png><h2>MELAN</h2></div><div class=card><b>App not connected</b><p class=m>The admin puts the Turso URL and token in the file config.js once. For a quick test you can type them here.</p><input id=du placeholder="libsql://your-db.turso.io" value="${esc(c.url||'')}"><input id=dt placeholder="Auth token" value="${esc(c.token||'')}"><button onclick="saveCfg()">Save</button></div></div>`}
const saveCfg=safe(async()=>{localStorage.setItem('cfg',JSON.stringify({url:val('du').replace('libsql://','https://'),token:val('dt')}));localStorage.removeItem('mig');await migrate();auth()});

/* ---------- sign in / register ---------- */
function auth(){const t=M;$('#app').innerHTML=`<div class=lg><div class=hero><img src=logo-96.png><h2>MELAN</h2><p>Learn. Practice. Grow. · v8</p></div>
<div class=tabs>${[['l','Learner'],['t','Teacher'],['o','Admin']].map(x=>`<button class="${t===x[0]?'on':''}" onclick="M='${x[0]}';auth()">${x[1]}</button>`).join('')}</div>
<div class=card>${t!=='o'?'<input id=sc placeholder="School code" autocapitalize=characters>':''}${t==='l'?'<input id=pn type=password autocapitalize=characters placeholder="Your individual learner code">':'<input id=nm placeholder="Your name"><input id=pn type=password placeholder="PIN">'}<button onclick="login()">Sign in</button></div>
${t==='l'?`<details class=card><summary><b>New learner? Register here</b></summary><p class=m>Use the school code and the class code your teacher gave you.</p><input id=rs placeholder="School code" autocapitalize=characters><input id=rc placeholder="Class code" autocapitalize=characters><input id=rn placeholder="YOUR NAMES IN CAPITAL LETTERS" style="text-transform:uppercase"><select id=rg><option value=F>Girl</option><option value=M>Boy</option></select><input id=rph placeholder="Parent phone (optional)"><p class=m>MELAN will generate your unique learner login code after registration. Keep it safe.</p><button onclick="regL()">Register</button></details>`:''}
${t==='o'?'<div id=ow></div>':''}</div>`;if(t==='o')ownerBox()}
const ownerBox=safe(async()=>{const n=(await db("select count(*) c from x_users where role='super'"))[0].c;$('#ow').innerHTML=+n?'':`<div class=card><b>First time: create the admin</b><input id=on placeholder="Admin name"><input id=op type=password placeholder="PIN"><button onclick="mkOwner()">Create admin</button></div>`});
const mkOwner=safe(async()=>{if(!val('on')||val('op').length<4)throw new Error('Enter a name and a PIN of 4 or more characters');if(+(await db("select count(*) c from x_users where role='super'"))[0].c)throw new Error('An admin already exists');
 const id=await ins("insert into x_users(school_id,name,role,pin) values(0,?,'super',?) returning id",[val('on'),await hash(val('op'))]);start({id,sid:0,name:val('on'),role:'super',sn:'MELAN Admin'})});
const login=safe(async()=>{await migrate();let u,s;
 if(M==='o'){u=(await db("select * from x_users where role='super' and lower(name)=lower(?) and pin=?",[val('nm'),await hash(val('pn'))]))[0];if(!u)throw new Error('Wrong name or PIN');return start({id:+u.id,sid:0,name:u.name,role:'super',sn:'MELAN Admin'})}
 s=(await db('select * from x_schools where code=?',[val('sc').toUpperCase()]))[0];if(!s)throw new Error('School code not found');
 u=M==='t'?(await db("select * from x_users where school_id=? and role='teacher' and lower(name)=lower(?) and pin=?",[s.id,val('nm'),await hash(val('pn'))]))[0]:(await db("select * from x_users where school_id=? and role='learner' and (pin=? or upper(cno)=upper(?))",[s.id,await hash(val('pn')),val('pn')]))[0];
 if(!u)throw new Error(M==='t'?'Name or PIN is wrong':'That code is not right for this school');start({id:+u.id,sid:+s.id,name:u.name,role:u.role,cls:u.cls,cno:u.cno,sn:s.name,tcls:u.tcls})});
const makeLearnerCode=async cls=>{const year=new Date().getFullYear(),prefix=String(cls||'P').toUpperCase().replace(/[^A-Z0-9]/g,'')||'P';let n=1,code='';for(let tries=0;tries<10000;tries++){code=prefix+n+year;if(!(await db('select code from x_learner_codes where code=?',[code]))[0]&&!(await db('select id from x_users where cno=?',[code]))[0])return code;n++}throw new Error('Could not generate a unique learner code')};
const regL=safe(async()=>{await migrate();const s=(await db('select * from x_schools where code=?',[val('rs').toUpperCase()]))[0];if(!s)throw new Error('School code not found');
 const c=(await db('select * from x_classes where school_id=? and code=?',[s.id,val('rc').toUpperCase()]))[0];if(!c)throw new Error('Class code not found. Ask your teacher');
 const nm=val('rn').toUpperCase();if(!nm)throw new Error('Enter your names');
 const code=await makeLearnerCode(c.name),h=await hash(code);
 const id=await ins("insert into x_users(school_id,name,role,gender,cls,pin,pinp,cno,phone) values(?,?,'learner',?,?,?,?,?,?) returning id",[s.id,nm,val('rg'),c.name,h,code,code,val('rph')]);await db('insert into x_learner_codes(code,user_id) values(?,?)',[code,id]);
 alert('Registration successful. Your individual MELAN login code is: '+code+'. Use this code every time you sign in.');start({id,sid:+s.id,name:nm,role:'learner',cls:c.name,cno:code,sn:s.name})});
async function start(u){await migrate();U=u;localStorage.setItem('u',JSON.stringify(u));
 if(u.sid){SS=(await db('select * from x_schools where id=?',[u.sid]))[0];SET={...DEF,...JSON.parse(SS.settings||'{}')};if(u.role!=='learner')await loadRef();if(u.role==='teacher')U.tcls=(await db('select tcls from x_users where id=?',[u.id]))[0].tcls}
 shell();if(PQ&&u.role!=='super'){const p=PQ;PQ=null;openShared(p)}}
const loadRef=async()=>{[SUBS,CLS]=await Promise.all([db('select * from x_subjects where school_id=? order by name',[U.sid]),db('select * from x_classes where school_id=? order by name',[U.sid])])};
const out=()=>{localStorage.removeItem('u');U=null;auth()};
const openShared=safe(async pid=>{const p=(await db('select * from x_papers where id=?',[pid]))[0];if(!p||p.school_id!=U.sid)return alert('This paper is not available to you');
 if(U.role==='learner'){if((p.cls||'').toLowerCase()!==(U.cls||'').toLowerCase()||p.status==='draft')return alert('This paper is not for your class');nav('lp');const s=(await db('select id from x_submissions where paper_id=? and learner_id=?',[pid,U.id]))[0];return lOpen(pid,s?+s.id:0,p.status,p.deadline||'')}
 qView(pid)});

/* ---------- owner: schools and teachers ---------- */
const vSch=safe(async()=>{window.SCH=await db("select s.*,(select count(*) from x_users where school_id=s.id and role='teacher') tc,(select count(*) from x_users where school_id=s.id and role='learner') lc from x_schools s order by id desc");

/* ---------- coverage (over-set reminders) ---------- */
async function cov(){const a=[TF(),U.sid];
 const [t,s]=await Promise.all([db('select t.*,(select count(*) from x_questions q join x_papers p on p.id=q.paper_id where q.topic_id=t.id and p.teacher_id like ?) n from x_topics t where t.school_id=? order by cls,term,subject,name',a),
 db('select s.*,(select count(*) from x_questions q join x_papers p on p.id=q.paper_id where q.sub_id=s.id and p.teacher_id like ?) n from x_subtopics s where topic_id in(select id from x_topics where school_id=?)',a)]);return{t,s}}
const flag=n=>n>=SET.overN?'red':n==0?'org':'grn';
function tree(d,only){const by={};d.t.forEach(x=>(by[x.cls]??=[]).push(x));let h='';
 for(const c in by){const ts=by[c].filter(x=>!only||x.n>=SET.overN||(x.n==0)||d.s.some(s=>s.topic_id==x.id&&s.n>=SET.overN));if(!ts.length)continue;const tot=by[c].reduce((a,x)=>a+ +x.n,0);
  h+=`<div class=card><b>${esc(c)}</b> <span class=m>${tot} questions picked from this class</span>`+ts.map(x=>`<div style="margin:8px 0"><span class="${flag(+x.n)}"><b>${esc(x.name)}</b></span> <span class=m>${esc(x.subject)}, Term ${esc(x.term)} · set ${x.n}×${x.n>=SET.overN?' · OVER-SET':x.n==0?' · not set yet':''}</span>`+
  d.s.filter(s=>s.topic_id==x.id&&(!only||s.n>=SET.overN||s.n==0)).map(s=>`<div class="m ${flag(+s.n)}" style="margin-left:14px">- ${esc(s.name)} (${s.n}×)${s.n>=SET.overN?' over-set':s.n==0?' ignored':''}</div>`).join('')+'</div>').join('')+'</div>'}
 return h||'<p class=m>Nothing to report yet.</p>'}
const vHome=async()=>{const [d,m,n]=await Promise.all([cov(),db('select count(distinct a.sub_id) c from x_answers a join x_submissions s on s.id=a.sub_id join x_papers p on p.id=s.paper_id where p.school_id=? and a.score is null',[U.sid]),
 db("select (select count(*) from x_users where school_id=? and role='learner') l,(select count(*) from x_papers where school_id=? and teacher_id like ?) p",[U.sid,U.sid,TF()])]);
 const ov=d.t.filter(x=>x.n>=SET.overN).length,ig=d.t.filter(x=>x.n==0).length;
 $('#v').innerHTML=`<div class=card><h2 style="margin:0">Welcome, ${esc(U.name)}</h2><p class=m>${esc(SS.name)} · School code <b>${esc(SS.code)}</b></p><div class=row><div><b style="font-size:26px">${n[0].l}</b><br><span class=m>learners</span></div><div><b style="font-size:26px">${n[0].p}</b><br><span class=m>my papers</span></div><div><b style="font-size:26px" class=org>${m[0].c}</b><br><span class=m>scripts waiting to be marked</span></div></div></div>
 <div class=card><b>Reminders</b><p class=m>You are over-setting <b class=red>${ov}</b> topic(s) (${SET.overN} or more questions) and ignoring <b class=org>${ig}</b> topic(s). Subtopics and the classes you pick from are listed below.</p><button onclick="nav('papers')">Set or mark a paper</button></div>`+tree(d,true)};

/* ---------- curriculum ---------- */
async function vCur(){const t=await db('select t.*,(select count(*) from x_subtopics where topic_id=t.id) sc,(select count(*) from x_comps where topic_id=t.id) cc,(select count(*) from x_questions q join x_papers p on p.id=q.paper_id where q.topic_id=t.id and p.teacher_id like ?) n from x_topics t where school_id=? order by cls,term,subject,name',[TF(),U.sid]);window.TP=t;
 $('#v').innerHTML=`<div class=card><b>Find a topic</b><input id=cs placeholder="Search by topic, class or subject" oninput="curList()"></div>
 <details class=card><summary><b>Add new topics (outline)</b></summary>${CLS.length&&SUBS.length?`<p class=m>Choose class, term and subject. A plain line is a topic, a line starting with - is a subtopic, and a line starting with * is a competence under the subtopic above it. You can add more later.</p>
 <select id=o1>${myCls().map(c=>`<option>${esc(c.name)}</option>`).join('')}</select><div class=row><select id=o2><option>1</option><option>2</option><option>3</option></select><select id=o3>${SUBS.map(c=>`<option value="${esc(c.name)}">${esc(c.name)} (${esc(c.short)})</option>`).join('')}</select></div>
 <textarea id=o4 style="min-height:130px" placeholder="Types of computers&#10;- Laptop&#10;* Learner can compare computers&#10;- Desktop"></textarea><button onclick="saveOutline()">Save outline</button>`:'<p class=m>First add your classes and subjects under Classes & subjects.</p>'}</details><div id=cl></div>`;curList()}
const curList=()=>{const k=($('#cs').value||'').toLowerCase();$('#cl').innerHTML=TP.filter(x=>(x.name+' '+x.cls+' '+x.subject).toLowerCase().includes(k)).map(x=>`<div class=card onclick="topicPage(${x.id})"><div class=row><b class="${flag(+x.n)}">${esc(x.name)}</b><span class=m>${esc(x.cls)} · T${esc(x.term)} · ${esc(x.subject)}</span></div><div class=m>${x.sc} subtopics · ${x.cc} competences · set ${x.n}×${x.n>=SET.overN?' (over-set)':''}</div></div>`).join('')||'<p class=m>No topic found.</p>'};
const lines=id=>$('#'+id).value.split('\n').map(x=>x.trim().replace(/^[-*]\s*/,'')).filter(Boolean);
const topicPage=safe(async id=>{const t=(await db('select * from x_topics where id=?',[id]))[0];
 const [s,c]=await Promise.all([db('select s.*,(select count(*) from x_questions q join x_papers p on p.id=q.paper_id where q.sub_id=s.id and p.teacher_id like ?) n from x_subtopics s where topic_id=? order by id',[TF(),id]),db('select * from x_comps where topic_id=? order by id',[id])]);
 const ed=(tb,i)=>`<a onclick="ren('${tb}',${i},${id})">✎</a> <a onclick="del('${tb}',${i},${id})">✕</a>`;
 $('#v').innerHTML=`<button class="pri ghost" onclick="nav('cur')">Back to topics</button><br><br><div class=card><div class=row><b>${esc(t.name)}</b><span>${ed('x_topics',id)}</span></div><div class=m>${esc(t.cls)} · Term ${esc(t.term)} · ${esc(t.subject)}</div>
 <details><summary class=m>Change class, term or subject</summary><select id=tc>${CLS.map(x=>`<option ${x.name===t.cls?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select id=tm>${[1,2,3].map(x=>`<option ${x==t.term?'selected':''}>${x}</option>`).join('')}</select><select id=ts>${SUBS.map(x=>`<option ${x.name===t.subject?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class=pri onclick="moveTopic(${id})">Save changes</button></details>
 <p class=m>Add more subtopics, one per line:</p><textarea id=ns1></textarea><button onclick="addSubs(${id})">Add subtopics</button></div>`+
 s.map(x=>`<div class=card><div class=row><b>${esc(x.name)} <span class="m ${flag(+x.n)}">set ${x.n}×</span></b><span>${ed('x_subtopics',x.id)}</span></div>${c.filter(y=>y.sub_id==x.id).map(y=>`<div class="row m"><span>- ${esc(y.name)}</span><span>${ed('x_comps',y.id)}</span></div>`).join('')}<textarea id=nc${x.id} placeholder="Add competences, one per line"></textarea><button class=ghost onclick="addComps(${x.id},${id})">Add competences</button></div>`).join('')+
 (c.some(y=>!y.sub_id)?`<div class=card><b>Other competences</b>${c.filter(y=>!y.sub_id).map(y=>`<div class="row m"><span>- ${esc(y.name)}</span><span>${ed('x_comps',y.id)}</span></div>`).join('')}</div>`:'')});
const OKT=['x_topics','x_subtopics','x_comps'];
const ren=safe(async(tb,id,tid)=>{if(!OKT.includes(tb))return;const cur=(await db(`select name from ${tb} where id=?`,[id]))[0].name,n=prompt('Edit name',cur);if(!n||!n.trim())return;await db(`update ${tb} set name=? where id=?`,[n.trim(),id]);topicPage(tid)});
const del=safe(async(tb,id,tid)=>{if(!OKT.includes(tb))return;if(tb==='x_topics'&&+(await db('select count(*) c from x_questions where topic_id=?',[id]))[0].c)throw new Error('Questions already use this topic, so it cannot be deleted');
 if(tb==='x_subtopics'&&+(await db('select count(*) c from x_questions where sub_id=?',[id]))[0].c)throw new Error('Questions already use this subtopic');if(!confirm('Delete this? It cannot be undone.'))return;
 if(tb==='x_topics'){await db('delete from x_subtopics where topic_id=?',[id]);await db('delete from x_comps where topic_id=?',[id])}if(tb==='x_subtopics')await db('delete from x_comps where sub_id=?',[id]);await db(`delete from ${tb} where id=?`,[id]);tb==='x_topics'?nav('cur'):topicPage(tid)});
const moveTopic=safe(async id=>{await db('update x_topics set cls=?,term=?,subject=? where id=?',[val('tc'),val('tm'),val('ts'),id]);topicPage(id)});
const addSubs=safe(async tid=>{for(const n of lines('ns1'))if(!(await db('select id from x_subtopics where topic_id=? and lower(name)=lower(?)',[tid,n]))[0])await db('insert into x_subtopics(topic_id,name) values(?,?)',[tid,n]);topicPage(tid)});
const addComps=safe(async(sid,tid)=>{for(const n of lines('nc'+sid))if(!(await db('select id from x_comps where sub_id=? and lower(name)=lower(?)',[sid,n]))[0])await db('insert into x_comps(topic_id,sub_id,name) values(?,?,?)',[tid,sid,n]);topicPage(tid)});
const saveOutline=safe(async()=>{const cls=val('o1'),term=val('o2'),sub=val('o3'),txt=$('#o4').value;if(!txt.trim())throw new Error('Type the outline');let t=null,sb=null;
 for(const raw of txt.split('\n')){const l=raw.trim();if(!l)continue;const k=l[0],name=l.replace(/^[-*]\s*/,'');
  if(k==='-'){if(!t)continue;const e=(await db('select id from x_subtopics where topic_id=? and lower(name)=lower(?)',[t,name]))[0];sb=e?+e.id:await ins('insert into x_subtopics(topic_id,name) values(?,?) returning id',[t,name])}
  else if(k==='*'){if(!t)continue;if(!(await db('select id from x_comps where topic_id=? and sub_id is ? and lower(name)=lower(?)',[t,sb,name]))[0])await db('insert into x_comps(topic_id,sub_id,name) values(?,?,?)',[t,sb,name])}
  else{const e=(await db('select id from x_topics where school_id=? and cls=? and term=? and lower(subject)=lower(?) and lower(name)=lower(?)',[U.sid,cls,term,sub,name]))[0];t=e?+e.id:await ins('insert into x_topics(school_id,cls,term,subject,name) values(?,?,?,?,?) returning id',[U.sid,cls,term,sub,name]);sb=null}}
 nav('cur')});

 <div class=card><b>Classes</b><p class=m>Each class has its own code. Learners need it to register.</p>${CLS.map(c=>`<div class=row style="margin:6px 0"><span><b>${esc(c.name)}</b> <span class=tag>Code ${esc(c.code)}</span></span><span><a onclick="renCls(${c.id})">Edit</a> · <a onclick="shareCls(${c.id})">Share</a> · <a onclick="delCls(${c.id})">Delete</a></span></div>`).join('')}<input id=cn1 placeholder="New class, for example P5"><button onclick="addCls()">Add class</button></div>`});

 await db('update x_subjects set name=?,short=? where id=?',[n.trim(),sh.toUpperCase(),id]);for(const t of ['x_topics','x_papers'])await db(`update ${t} set subject=? where school_id=? and subject=?`,[n.trim(),U.sid,s.name]);vCls()});

async function collect(){const cs=$$('.qc');if(!cs.length)throw new Error('Add at least one question');const out=[];

  for(const p of ps){if(p.kind==='mcq'&&p.data.opts.length<2)throw new Error('Multiple choice needs at least two options');if(p.kind==='match'&&p.data.a.some(x=>!x)||p.kind==='match'&&p.data.b.some(x=>!x))throw new Error('Fill every box in both matching lists');if(p.kind==='gap'&&!p.data.s.includes('___'))throw new Error('Put ___ where each gap should be')}

  await pipe(q.ps.map((p,j)=>['insert into x_parts(paper_id,qq,qn,label,n,text,kind,marks,spaces,bloom,data,guide) values(?,?,?,?,?,?,?,?,?,?,?,?)',[pid,qid,i+1,q.hp?String.fromCharCode(97+j):'',''+(i+1)+(q.hp?'('+String.fromCharCode(97+j)+')':''),p.text,p.kind,p.marks,p.spaces,p.bloom,JSON.stringify(p.data),p.guide]]))}}

 `<div class=row><button class="pri ghost" onclick="markQ(${Math.max(0,i-1)})">Previous</button><button class=pri onclick="${i+1<QS.length?`markQ(${i+1})`:`markHome(${PID})`}">${i+1<QS.length?'Next question':'Finish'}</button></div>`});

  return (pt.label?`<div class=pl2>(${pt.label}) ${esc(pt.text)}</div>`:pt.text?`<div><i>${esc(pt.text)}</i></div>`:'')+r.map((y,i)=>{const lab=pt.kind==='match'?`<span style="color:#555">${i+1}. ${esc((d.a||[])[i])} → </span>`:pt.kind==='gap'?`<span style="color:#555">Gap ${i+1}: </span>`:r.length>1?`<span style="color:#555">(${i+1}) </span>`:'',sc=+y.score||0,ok=sc>=pt.marks;
