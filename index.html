<style>

main{max-width:860px;margin:0 auto;padding:12px}.lg{max-width:460px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:0 0 10px}

.pri,.card>button,.card details>button{background:linear-gradient(90deg,#ea580c,#f97316);color:#fff;font-weight:700;border:0;border-radius:10px;padding:10px 14px;margin-top:6px;width:100%}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.row>*{flex:1}

.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;padding:9px;border:1px solid var(--b);background:var(--c);border-radius:12px}.tabs button.on{background:var(--p);color:var(--pt);border-color:var(--p);font-weight:700}

.g{background:var(--g)}.o{background:var(--o)}.r{background:var(--r)}
.chips label{display:inline-block;border:1px solid var(--b);border-radius:16px;padding:4px 12px;margin:3px 4px 3px 0;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid #bbb;padding:4px 6px;text-align:center}td:first-child,th:first-child{text-align:left}.wrap{overflow-x:auto}

.ph .mt{display:flex;justify-content:space-between;flex-wrap:wrap;font-size:14px;gap:4px 14px;margin-top:6px}.sheet .ph{padding:0 92px 8px}.sec{margin:16px 0 4px;border-bottom:1px solid #111;font-size:15px}
.qq{margin:12px 0}.pl2{margin:8px 0 2px}.mkq{float:right;font-weight:700}
.ln{background:repeating-linear-gradient(transparent 0,transparent 27px,#8a94a6 28px);line-height:28px;min-height:56px;padding:0 6px;white-space:pre-wrap;border:1px solid #777;border-radius:3px;position:relative;margin:4px 0;font-family:"Times New Roman",Times,serif;font-style:italic;color:#b42318}

.mrow{margin:6px 0}.slot{display:inline-block;min-width:130px;min-height:32px;border-bottom:2px solid #222;margin-right:8px;text-align:center;vertical-align:middle;padding:2px 6px;background:#f3f0ff;border-radius:4px;color:#1a3a9c}
.pool{border:1px dashed #888;border-radius:8px;padding:6px;margin-top:8px}.chip{display:inline-block;border:1px solid #5b21b6;border-radius:16px;padding:4px 12px;margin:4px;background:#fff;cursor:grab;user-select:none}.chip.sel{background:#f97316;color:#fff}.chip.used{opacity:.25;pointer-events:none}

.paper{font-size:13.5px}

.pctl{gap:6px;margin:4px 0}.pctl button{flex:0 0 auto;padding:6px 12px;border:1px solid #888;border-radius:8px;background:#fff!important;color:#111!important;width:auto;margin:0;font-weight:400}
.pctl select{flex:0 0 auto;width:auto!important;max-width:130px}
svg.pad{touch-action:none;cursor:crosshair;background:#fff;border:1px solid #444;display:block}
.dgd summary{cursor:pointer;margin:6px 0}
body.lr{font-size:17px}body.lr .card{border:2px solid #e9d5ff;border-radius:20px}body.lr aside{background:linear-gradient(180deg,#ea580c,#7c3aed)}body.lr .top{background:linear-gradient(90deg,#7c3aed,#ea580c)}body.lr .ni{font-size:18px}.lh{color:var(--p);margin:6px 0}
.rec{border-left:6px solid #f97316}.donut{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#7c3aed var(--pct),#e9dff7 0);font-weight:800}

<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
// MELAN in-app notifications: avoid browser '[site] says' alert boxes.
window.alert=(message)=>{const t=document.getElementById('melan-toast');if(!t)return; t.textContent=String(message??'');t.style.display='block';clearTimeout(window.__melanToastTimer);window.__melanToastTimer=setTimeout(()=>t.style.display='none',3600)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=['Knowledge','Understanding','Application','Analysis','Evaluation','Creation'];
const DEF={overN:6,grades:'',bands:[{min:80,name:'Distinction',c:'Excellent work. Keep it up.'},{min:60,name:'Credit',c:'Good work. Aim higher.'},{min:40,name:'Pass',c:'Fair. More practice needed.'},{min:0,name:'Needs help',c:'Please revise and ask for help.'}]};
let SET=DEF,SS={},U=JSON.parse(localStorage.getItem('u')||'null'),V='home',C={},G=[],QS=[],QI=0,PID=0,M='l',SUBS=[],CLS=[],PP={},NT={},DL='',SELC=null,PQ=new URLSearchParams(location.search).get('p');
const T=['create table if not exists x_schools(id integer primary key autoincrement,name text,code text unique,tcode text,settings text)',
'create table if not exists x_users(id integer primary key autoincrement,school_id int,name text,role text,gender text,cls text,pin text,pinp text,cno text,phone text,email text)',
'create table if not exists x_learner_codes(code text primary key,user_id int,created_at text default current_timestamp)',
"insert or ignore into x_learner_codes(code,user_id) select cno,id from x_users where role='learner' and cno is not null",
'create table if not exists x_classes(id integer primary key autoincrement,school_id int,name text,code text unique)',
'create table if not exists x_subjects(id integer primary key autoincrement,school_id int,name text,short text)',
'create table if not exists x_topics(id integer primary key autoincrement,school_id int,cls text,term text,subject text,name text)',
'create table if not exists x_subtopics(id integer primary key autoincrement,topic_id int,name text)',
'create table if not exists x_comps(id integer primary key autoincrement,topic_id int,sub_id int,name text)',
'create table if not exists x_papers(id integer primary key autoincrement,school_id int,teacher_id int,title text,cls text,term text,subject text,status text,pdate text,deadline text,plan text,shuffle int)',
'create table if not exists x_questions(id integer primary key autoincrement,paper_id int,n int,sec text,stem text,topic_id int,sub_id int,comp_id int)',
'create table if not exists x_parts(id integer primary key autoincrement,paper_id int,qq int,qn int,label text,n text,text text,kind text,marks real,spaces int,bloom text,data text,guide text)',
'create table if not exists x_submissions(id integer primary key autoincrement,paper_id int,learner_id int)',
'create table if not exists x_answers(id integer primary key autoincrement,sub_id int,qid int,idx int,answer text,norm text,score real,comment text)',
'create index if not exists j1 on x_answers(qid,norm)','create index if not exists j2 on x_answers(sub_id)','create index if not exists j3 on x_parts(paper_id)','create index if not exists j4 on x_questions(paper_id)',
'create index if not exists j5 on x_topics(school_id,subject)','create index if not exists j6 on x_users(school_id,role,pin)','create index if not exists j7 on x_submissions(paper_id,learner_id)','create index if not exists j8 on x_subtopics(topic_id)','create index if not exists j9 on x_comps(topic_id)',
'create index if not exists j10 on x_users(cno)','create index if not exists j11 on x_users(school_id,role,cls)','create index if not exists j12 on x_papers(school_id,status,cls)','create index if not exists j13 on x_answers(sub_id,qid)','create index if not exists j14 on x_submissions(learner_id,paper_id)','create index if not exists j15 on x_questions(topic_id,sub_id)','create index if not exists j16 on x_parts(paper_id,qn)'];
const cfg=()=>{const c=window.CFG||{};return c.url&&c.token?{url:c.url.replace('libsql://','https://'),token:c.token}:JSON.parse(localStorage.getItem('cfg')||'null')};
const arg=v=>v==null?{type:'null'}:typeof v==='number'?(Number.isInteger(v)?{type:'integer',value:String(v)}:{type:'float',value:v}):{type:'text',value:String(v)};
let REFS=0,REFT=0,PN=0;const PB=n=>{PN+=n;const b=document.getElementById('pb');if(b)b.style.display=PN>0?'block':'none'};
async function pipe(list){PB(1);try{return await pipe0(list)}finally{PB(-1)}}
async function pipe0(list){const c=cfg();const r=await fetch(c.url+'/v2/pipeline',{method:'POST',headers:{Authorization:'Bearer '+c.token,'Content-Type':'application/json'},body:JSON.stringify({requests:[...list.map(([sql,a=[]])=>({type:'execute',stmt:{sql,args:a.map(arg)}})),{type:'close'}]})});
 const j=await r.json();if(!j.results)throw new Error(j.error||'Database error');
 return j.results.slice(0,list.length).map(x=>{if(x.type==='error')throw new Error(x.error.message);const q=x.response.result;return q.rows.map(w=>Object.fromEntries(q.cols.map((c,i)=>[c.name,w[i].value])))})}
const db=async(sql,a=[])=>(await pipe([[sql,a]]))[0];
const ins=async(s,a)=>Number((await db(s,a))[0].id);
async function migrate(){if(localStorage.getItem('mig')==='x5')return;let ok=true;for(const q of T)try{await db(q)}catch(e){ok=false}
for(const q of ['alter table x_users add column tcls text','alter table x_users add column leaving int','alter table x_papers add column guide_rel int','alter table x_schools add column tcode text','create table if not exists x_hist(id integer primary key autoincrement,user_id int,cls text,code text,yr text,at text default current_timestamp)','create index if not exists j17 on x_hist(user_id)','alter table x_papers add column allow_unfinished int default 0'])try{await db(q)}catch(e){if(!/duplicate|already exists/i.test(e.message))ok=false}
if(ok)localStorage.setItem('mig','x5')}
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const opts=(r,k='name')=>r.map(x=>`<option value="${x.id}">${esc(x[k])}</option>`).join('');
const val=id=>$('#'+id).value.trim(),safe=f=>async(...a)=>{try{await f(...a)}catch(e){alert(e.message)}};
const pc=t=>t&&t[1]?Math.round(t[0]/t[1]*100):0,band=p=>SET.bands.find(b=>p>=b.min)||SET.bands[SET.bands.length-1];
const norm=s=>s.toLowerCase().replace(/\s+/g,' ').replace(/[.,;!]+$/,'').trim();
const grade=p=>{for(const l of (SET.grades||'').split('\n')){const m=l.match(/(\d+)\s*-\s*(\d+)\s*=\s*(\S+)/);if(m&&p>=+m[1]&&p<=+m[2])return m[3]}return''},gtxt=p=>grade(p)?` · Grade ${grade(p)}`:'';
const bars=b=>L.map(l=>{const v=b[l];if(!v||!v[1])return `<div class=bar><span>${l}</span><div></div><em>-</em></div>`;const p=pc(v);return `<div class=bar><span>${l}</span><div><i class="${p>=70?'g':p>=50?'o':'r'}" style="width:${p}%"></i></div><em>${p}%</em></div>`}).join('');
const dl=(id,a)=>`<datalist id=${id}>${[...new Set(a)].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
const fd=x=>{if(!x)return'';const d=new Date(String(x).length===10?x+'T00:00:00':x);return isNaN(d)?String(x):`${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]} ${String(d.getDate()).padStart(2,'0')} ${String(d.getMonth()+1).padStart(2,'0')} ${d.getFullYear()}`},base=()=>location.href.split('?')[0].split('#')[0],wa=t=>window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
const myCls=()=>{const a=(U.tcls||'').split('|').filter(Boolean);return U.role==='teacher'&&a.length?CLS.filter(c=>a.includes(c.name)):CLS};
const TF=()=>U.role==='super'?'%':String(U.id);
const rcode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:5},()=>a[Math.floor(Math.random()*a.length)]).join('')};
const rnd4=()=>String(Math.floor(1000+Math.random()*9000));

/* ---------- connection (owner only) ---------- */
function setup(){const c=cfg()||{};$('#app').innerHTML=`<div class=lg><div class=hero><img src=logo-96.png><h2>MELAN</h2></div><div class=card><b>App not connected</b><p class=m>The admin puts the Turso URL and token in the file config.js once. For a quick test you can type them here.</p><input id=du placeholder="libsql://your-db.turso.io" value="${esc(c.url||'')}"><input id=dt placeholder="Auth token" value="${esc(c.token||'')}"><button onclick="saveCfg()">Save</button></div></div>`}
const saveCfg=safe(async()=>{localStorage.setItem('cfg',JSON.stringify({url:val('du').replace('libsql://','https://'),token:val('dt')}));localStorage.removeItem('mig');await migrate();auth()});

/* ---------- sign in / register ---------- */
function auth(){const t=M;$('#app').innerHTML=`<div class=lg><div class=hero><img src=logo-96.png><h2>MELAN</h2><p>Learn. Practice. Grow. · v10</p></div>
<div class=tabs>${[['l','Learner'],['t','Teacher'],['o','Admin']].map(x=>`<button class="${t===x[0]?'on':''}" onclick="M='${x[0]}';auth()">${x[1]}</button>`).join('')}</div>
<div class=card>${t!=='o'?'<input id=sc placeholder="School code" autocapitalize=characters>':''}${t==='l'?'<input id=pn type=password autocapitalize=characters placeholder="Your individual learner code">':'<input id=nm placeholder="Your name"><input id=pn type=password placeholder="PIN">'}<button onclick="login()">Sign in</button></div>
${t==='l'?`<details class=card><summary><b>New learner? Register here</b></summary><p class=m>Use the school code and the class code your teacher gave you.</p><input id=rs placeholder="School code" autocapitalize=characters><input id=rc placeholder="Class code" autocapitalize=characters><input id=rn placeholder="YOUR NAMES IN CAPITAL LETTERS" style="text-transform:uppercase"><select id=rg><option value=F>Girl</option><option value=M>Boy</option></select><input id=rph placeholder="Parent phone (optional)"><p class=m>MELAN will generate your unique learner login code after registration. Keep it safe.</p><button onclick="regL()">Register</button></details>`:''}
${t==='t'?`<details class=card><summary><b>New teacher? Register here</b></summary><p class=m>Ask your school for the school code and the teachers' code.</p><input id=ts1 placeholder="School code" autocapitalize=characters><input id=ts2 placeholder="Teachers' code" autocapitalize=characters><input id=ts3 placeholder="Your full name"><input id=ts4 type=tel placeholder="Your WhatsApp number (learners can reach you)"><input id=ts5 type=password placeholder="Choose a PIN (4 or more characters)"><button onclick="regT()">Register</button></details>`:''}
${t==='o'?'<div id=ow></div>':''}</div>`;if(t==='o')ownerBox()}
const regT=safe(async()=>{await migrate();const s=(await db('select * from x_schools where code=?',[val('ts1').toUpperCase()]))[0];if(!s)throw new Error('School code not found');if(!s.tcode||s.tcode.toUpperCase()!==val('ts2').toUpperCase())throw new Error("The teachers' code is not right. Ask your school admin");const n=val('ts3'),p=val('ts5');if(!n||p.length<4)throw new Error('Enter your name and a PIN of 4 or more characters');
 if((await db("select id from x_users where school_id=? and role='teacher' and lower(name)=lower(?)",[s.id,n]))[0])throw new Error('This name is already registered. Please sign in');
 const id=await ins("insert into x_users(school_id,name,role,pin,phone) values(?,?,'teacher',?,?) returning id",[s.id,n,await hash(p),val('ts4')]);start({id,sid:+s.id,name:n,role:'teacher',sn:s.name,tcls:null})});
const ownerBox=safe(async()=>{const n=(await db("select count(*) c from x_users where role='super'"))[0].c;$('#ow').innerHTML=+n?'':`<div class=card><b>First time: create the admin</b><input id=on placeholder="Admin name"><input id=op type=password placeholder="PIN"><button onclick="mkOwner()">Create admin</button></div>`});
const mkOwner=safe(async()=>{if(!val('on')||val('op').length<4)throw new Error('Enter a name and a PIN of 4 or more characters');if(+(await db("select count(*) c from x_users where role='super'"))[0].c)throw new Error('An admin already exists');
 const id=await ins("insert into x_users(school_id,name,role,pin) values(0,?,'super',?) returning id",[val('on'),await hash(val('op'))]);start({id,sid:0,name:val('on'),role:'super',sn:'MELAN Admin'})});
const login=safe(async()=>{await migrate();let u,s;

const flag=n=>n>=SET.overN?'red':n==0?'org':'grn';
function tree(d,only){const by={};d.t.forEach(x=>(by[x.cls]??=[]).push(x));let h='';
 for(const c in by){const ts=by[c].filter(x=>!only||x.n>=SET.overN||(x.n==0)||d.s.some(s=>s.topic_id==x.id&&s.n>=SET.overN));if(!ts.length)continue;const tot=by[c].reduce((a,x)=>a+ +x.n,0);

function padDim(sv,w,h){sv.dataset.w=w;sv.dataset.h=h;sv.setAttribute('viewBox',`0 0 1000 ${Math.round(1000*h/w)}`);sv.style.width=`min(100%,${cmpx(w)}px)`}
const padFull=sv=>{sv.innerHTML=(sv.dataset.bg?polys(parseSt(sv.dataset.bg)):'')+polys(sv.__st)};
function mkPad(sv){sv.__st=parseSt(sv.dataset.s);sv.dataset.i=1;padDim(sv,+sv.dataset.w||12,+sv.dataset.h||8);let cur=null;
 const pt=e=>{const r=sv.getBoundingClientRect(),H=1000*sv.dataset.h/sv.dataset.w;return[Math.round((e.clientX-r.left)/r.width*1000),Math.round((e.clientY-r.top)/r.height*H)]};
 sv.onpointerdown=e=>{e.preventDefault();if(padStr(sv).length>40000){alert('This drawing is full. Please use Undo or Clear.');return}sv.setPointerCapture(e.pointerId);const w=sv.closest('.pdw'),col=w.querySelector('.pcol'),wd=w.querySelector('.pwd');cur={c:PC[+col.value],w:+wd.value,p:pt(e)};sv.__st.push(cur);sv.insertAdjacentHTML('beforeend',polys([cur]))};
 sv.onpointermove=e=>{if(!cur)return;const [x,y]=pt(e),p=cur.p,n=p.length;if(Math.abs(x-p[n-2])+Math.abs(y-p[n-1])<4)return;p.push(x,y);sv.lastElementChild.setAttribute('points',pstr(p))};
 sv.onpointerup=sv.onpointercancel=()=>{cur=null};padFull(sv)}

 if(k==='draw'){const w=d.dg?d.dg.w:d.w||12,h=d.dg?d.dg.h:d.h||8;b=inp?padBox(w,h,'',d.dg?d.dg.s:''):svgOf('',w,h,d.dg?d.dg.s:'')}else if(k==='text')b=Array.from({length:sp},()=>inp?'<textarea class=an></textarea>':'<div class=ln></div>').join('');

 else if(k==='gap'){const seg=(d.s||'').split('___');b=`<div class=gp>${seg.map((s,i)=>esc(s)+(i<seg.length-1?(inp?'<input class=gi>':'<span class=bl></span>'):'')).join('')}</div>`}
 else{const bs=shuf(d.b||[],seed*7+ +p.id);b=`<div>${(d.a||[]).map((a,i)=>`<div class=mrow><span class=slot data-v="" ${inp?'onclick="slotTap(this)" ondragover="event.preventDefault()" ondrop="dropS(event,this)"':''}></span><span>${i+1}. ${esc(a)}</span></div>`).join('')}</div><div class=pool>${bs.map(x=>`<span class=chip data-t="${esc(x)}" ${inp?'draggable=true ondragstart="dragS(event,this)" onclick="chipTap(this)"':''}>${esc(x)}</span>`).join('')}</div>`}

async function collect(){const cs=$$('.qc');if(!cs.length)throw new Error('Add at least one question');const out=[];
 for(const c of cs){const g=k=>c.querySelector(k),hp=g('.hp').checked,ps=[...c.querySelectorAll('.pt')].map(readPart);
  if(!g('.qtp').value)throw new Error('Choose a topic for every question');if(!g('.qt').value.trim()&&!ps.some(p=>p.text))throw new Error('Write every question');
  for(const p of ps){if(p.kind==='mcq'&&p.data.opts.length<2)throw new Error('Multiple choice needs at least two options');if(p.kind==='match'&&(p.data.a.some(x=>!x)||p.data.b.some(x=>!x)))throw new Error('Fill every box in both matching lists');if(p.kind==='gap'&&!p.data.s.includes('___'))throw new Error('Put ___ where each gap should be')}
  out.push({id:c.dataset.qid||'',stem:g('.qt').value.trim(),t:g('.qtp').value,s:g('.qst').value||null,c:g('.qcp').value||null,hp,sec:hp?'C':ps[0].spaces>1?'B':'A',ps})}
 return out.map((q,i)=>({q,i})).sort((a,b)=>a.q.sec.localeCompare(b.q.sec)||a.i-b.i).map(x=>x.q)}
/* one single database request saves the whole paper: no duplicates, much faster */
async function persist(pid){const qs=await collect();if(!val('e1'))throw new Error('Enter the paper title');

 const hasQ=new Set(eq.map(x=>String(x.id))),hasP=new Set(ep.map(x=>String(x.id))),keepQ=new Set(qs.map(q=>String(q.id))),keepP=new Set(qs.flatMap(q=>q.ps.map(p=>String(p.pid))));
 const L1=[['update x_papers set title=?,cls=?,term=?,subject=?,pdate=?,deadline=?,shuffle=?,allow_unfinished=? where id=?',[val('e1'),val('e2'),val('e3'),val('e4'),val('e5'),val('e6')||null,$('#e7').checked?1:0,$('#e8').checked?1:0,pid]]];
 ep.filter(x=>!keepP.has(String(x.id))).forEach(x=>L1.push(['delete from x_answers where qid=?',[+x.id]],['delete from x_parts where id=?',[+x.id]]));
 eq.filter(x=>!keepQ.has(String(x.id))).forEach(x=>L1.push(['delete from x_questions where id=?',[+x.id]]));
 qs.forEach((q,i)=>{const old=hasQ.has(String(q.id));
  L1.push(old?['update x_questions set n=?,sec=?,stem=?,topic_id=?,sub_id=?,comp_id=? where id=?',[i+1,q.sec,q.stem,q.t,q.s,q.c,+q.id]]:['insert into x_questions(paper_id,n,sec,stem,topic_id,sub_id,comp_id) values(?,?,?,?,?,?,?)',[pid,i+1,q.sec,q.stem,q.t,q.s,q.c]]);
  q.ps.forEach((p,j)=>{const lab=q.hp?String.fromCharCode(97+j):'',nn=''+(i+1)+(q.hp?'('+lab+')':''),dj=JSON.stringify(p.data),qa=old?+q.id:pid;
   if(hasP.has(String(p.pid)))L1.push(['update x_parts set qq=?,qn=?,label=?,n=?,text=?,kind=?,marks=?,spaces=?,bloom=?,data=?,guide=? where id=?',[qa,i+1,lab,nn,p.text,p.kind,p.marks,p.spaces,p.bloom,dj,p.guide,+p.pid]]);
   else L1.push(['insert into x_parts(paper_id,qq,qn,label,n,text,kind,marks,spaces,bloom,data,guide) values(?,'+(old?'?':'(select max(id) from x_questions where paper_id=?)')+',?,?,?,?,?,?,?,?,?,?)',[pid,qa,i+1,lab,nn,p.text,p.kind,p.marks,p.spaces,p.bloom,dj,p.guide]])})});
